<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Sniper com Mensagem</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h2 { color: #00e676; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn-ativar { width: 100%; background-color: #007bff; color: white; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-card { background-color: #1e1e1e; border-left: 5px solid #00e676; padding: 15px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        .match-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; color: #b3b3b3; }
        .stat-item { background: #2a2a2a; padding: 10px; border-radius: 4px; text-align: center; }
        .highlight { color: #00e676; font-size: 1.2em; font-weight: bold; display: block; margin-top: 5px; }
        .update-info { text-align: center; color: #888; font-size: 0.85em; margin-top: 20px; }
        .error { color: #ff5252; text-align: center; padding: 15px; background: #2a0000; border-radius: 4px; font-weight: bold; }
        
        .alert-entry { border-left: 5px solid #ff3d00; background-color: #2b0c00; animation: pulse 2s infinite; }
        .alert-entry .highlight { color: #ff3d00; }
        .alert-banner { background: #ff3d00; color: white; text-align: center; font-weight: bold; padding: 8px; margin-bottom: 12px; border-radius: 4px; text-transform: uppercase; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(255, 61, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0); } }
    </style>
</head>
<body>

    <h2>Radar Sinais: Modo Sniper</h2>
    
    <button id="btnAtivar" class="btn-ativar">🔔 Permitir Mensagens e Ecrã Ligado</button>
    
    <div id="matches-container">A procurar oportunidades de valor ao vivo...</div>
    <div class="update-info" id="last-update">Atualização automática a cada 5 minutos.</div>

    <script>
        // APENAS COLOQUE A SUA CHAVE NA LINHA ABAIXO
        const apiKey = 'SUA_CHAVE_AQUI'; 
        
        const headers = { 'x-apisports-key': apiKey };
        let wakeLock = null;

        document.getElementById('btnAtivar').addEventListener('click', async () => {
            document.getElementById('btnAtivar').style.display = 'none';
            if ("Notification" in window) {
                const permissao = await Notification.requestPermission();
                if (permissao === "granted") {
                    new Notification("Radar Sniper Ativo", { body: "O radar exclusivo para o Brasil está pronto." });
                }
            }
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        });

        function exibirMensagemAlerta() {
            if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("🎯 ALERTA SNIPER BRASIL!", {
                    body: "Oportunidade detetada num jogo brasileiro! Verifique o radar."
                });
            }
        }

        async function fetchAdvancedMatches() {
            try {
                const liveResponse = await fetch('https://v3.football.api-sports.io/fixtures?live=all', { headers });
                const liveData = await liveResponse.json();
                
                const container = document.getElementById('matches-container');
                container.innerHTML = ''; 

                if (liveData.errors && Object.keys(liveData.errors).length > 0) {
                    throw new Error("Limite de pedidos da API esgotado.");
                }

                // FILTRO DE OURO: Apenas jogos do Brasil
                const todosJogos = liveData.response ? liveData.response : [];
                const jogosBrasil = todosJogos.filter(match => match.league.country === 'Brazil');

                const matches = jogosBrasil.slice(0, 5);
                let encontrouEntrada = false;

                if(!matches || matches.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#b3b3b3;">Sem jogos brasileiros ao vivo de momento.</p>';
                    updateTime();
                    return;
                }

                for (const match of matches) {
                    const fixtureId = match.fixture.id;
                    const elapsed = match.fixture.status.elapsed;
                    const homeG = match.goals.home ?? 0;
                    const awayG = match.goals.away ?? 0;
                    
                    const statsResponse = await fetch(`https://v3.football.api-sports.io/fixtures/statistics?fixture=${fixtureId}`, { headers });
                    const statsData = await statsResponse.json();

                    let totalCorners = 0;
                    let totalShots = 0;

                    if (statsData.response && statsData.response.length > 0) {
                        statsData.response.forEach(teamData => {
                            const corners = teamData.statistics.find(s => s.type === "Corner Kicks");
                            const shots = teamData.statistics.find(s => s.type === "Shots on Goal");
                            totalCorners += corners && corners.value !== null ? parseInt(corners.value) : 0;
                            totalShots += shots && shots.value !== null ? parseInt(shots.value) : 0;
                        });
                    }

                    // RÉGUA SNIPER
                    const diffGolos = Math.abs(homeG - awayG);
                    const jogoEquilibrado = diffGolos === 0 || diffGolos === 1;
                    const retaFinal = elapsed >= 82 && elapsed <= 87; 
                    const pressaoAlta = totalCorners >= 9 && totalShots >= 8; 

                    const sinalEntrada = retaFinal && jogoEquilibrado && pressaoAlta;

                    let cardClass = "match-card";
                    let bannerHtml = "";
                    let minColor = "#00e676";

                    if (sinalEntrada) {
                        cardClass = "match-card alert-entry";
                        bannerHtml = `<div class="alert-banner">🎯 SNIPER BRASIL: Over Cantos Limite</div>`;
                        minColor = "#ff3d00";
                        encontrouEntrada = true; 
                    }

                    const card = `
                        <div class="${cardClass}">
                            ${bannerHtml}
                            <div class="match-header">
                                <span>${match.teams.home.name} ${homeG} x ${awayG} ${match.teams.away.name}</span>
                                <span style="color: ${minColor};">${elapsed}' min</span>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-item">Competição: <span style="color: #fff;">${match.league.name}</span></div>
                                <div class="stat-item">Cantos: <span class="highlight">${totalCorners}</span></div>
                                <div class="stat-item">Remates: <span class="highlight">${totalShots}</span></div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
                
                if (encontrouEntrada) {
                    exibirMensagemAlerta();
                }

                updateTime();
            } catch (error) {
                document.getElementById('matches-container').innerHTML = `<p class="error">Falha: ${error.message}</p>`;
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('last-update').innerText = `Última verificação: ${now.toLocaleTimeString('pt-PT')} | Analisa a cada 5 minutos.`;
        }

        fetchAdvancedMatches();
        setInterval(fetchAdvancedMatches, 300000); 
    </script>
</body>
</html>
