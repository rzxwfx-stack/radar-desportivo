<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Sniper - Completo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 15px; }
        h2 { color: #00e676; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: center; font-size: 1.5em; margin-top: 5px; }
        
        /* Abas de Navegação */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 5px; background: #2a2a2a; border: none; color: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 0.9em; text-align: center; }
        .tab-btn.active { background: #00e676; color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn-ativar { width: 100%; background-color: #007bff; color: white; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
        .match-card { background-color: #1e1e1e; border-left: 5px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; color: #b3b3b3; }
        .stat-item { background: #2a2a2a; padding: 10px; border-radius: 4px; text-align: center; }
        .highlight { color: #00e676; font-size: 1.2em; font-weight: bold; display: block; margin-top: 5px; }
        .update-info { text-align: center; color: #888; font-size: 0.85em; margin-top: 10px; }
        
        /* Cores dos Sinais */
        .live-card { border-left-color: #00e676; }
        .alert-cantos { border-left-color: #ff3d00; background-color: #2b0c00; animation: pulseRed 2s infinite; }
        .alert-cantos .highlight { color: #ff3d00; }
        .banner-cantos { background: #ff3d00; color: white; text-align: center; font-weight: bold; padding: 8px; margin-bottom: 12px; border-radius: 4px; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(255, 61, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 61, 0, 0); } }

        .alert-golos { border-left-color: #ffb300; background-color: #2b1f00; animation: pulseGold 2s infinite; }
        .alert-golos .highlight { color: #ffb300; }
        .banner-golos { background: #ffb300; color: #000; text-align: center; font-weight: bold; padding: 8px; margin-bottom: 12px; border-radius: 4px; }
        @keyframes pulseGold { 0% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(255, 179, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0); } }
        
        .alert-duplo { border-left-color: #ff3d00; background-color: #2b0c00; animation: pulseRed 2s infinite; }

        /* Estilo Histórico & Próximos */
        .hist-item, .upcoming-item { background: #222; padding: 12px; border-radius: 4px; margin-bottom: 10px; font-size: 0.9em; border-left: 4px solid #888; }
        .hist-green { border-color: #00e676; }
        .hist-red { border-color: #ff5252; }
        .hist-pendente { border-color: #ffb300; }
        .upcoming-item { border-color: #007bff; display: flex; justify-content: space-between; align-items: center; }
        .time-badge { background: #007bff; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Radar Sniper BR</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="abrirAba('aba-aovivo', this)">🔴 Ao Vivo</button>
        <button class="tab-btn" onclick="abrirAba('aba-proximos', this)">📅 Próximos</button>
        <button class="tab-btn" onclick="abrirAba('aba-historico', this)">📊 Histórico</button>
    </div>
    
    <!-- ABA: AO VIVO -->
    <div id="aba-aovivo" class="tab-content active">
        <button id="btnAtivar" class="btn-ativar">🔔 Permitir Mensagens e Ecrã Ligado</button>
        <div id="matches-container">A procurar jogos ao vivo...</div>
        <div class="update-info" id="last-update">Atualiza a cada 5 minutos.</div>
    </div>

    <!-- ABA: PRÓXIMOS JOGOS -->
    <div id="aba-proximos" class="tab-content">
        <div id="upcoming-container">Clique na aba para carregar os jogos de hoje.</div>
    </div>

    <!-- ABA: HISTÓRICO -->
    <div id="aba-historico" class="tab-content">
        <div id="historico-list">Nenhum sinal registado.</div>
    </div>

    <script>
        const apiKey = 'b56be5ce70175d3f52e7556ef5accfb7'; 
        const headers = { 'x-apisports-key': apiKey };
        let wakeLock = null;
        let proximosCarregados = false;
        
        let historico = JSON.parse(localStorage.getItem('historicoSniperDuplo')) || [];

        // GESTÃO DE ABAS
        function abrirAba(idAba, btnElement) {
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idAba).classList.add('active');
            btnElement.classList.add('active');

            if (idAba === 'aba-proximos' && !proximosCarregados) {
                carregarProximosJogos();
            }
        }

        // FUNÇÃO: PRÓXIMOS JOGOS
        async function carregarProximosJogos() {
            const container = document.getElementById('upcoming-container');
            container.innerHTML = '<p style="text-align:center; color:#b3b3b3;">A carregar jogos do Brasil para hoje...</p>';
            
            try {
                // Obtém a data de hoje (Formato YYYY-MM-DD)
                const hoje = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
                const res = await fetch(`https://v3.football.api-sports.io/fixtures?date=${hoje}&timezone=America/Sao_Paulo`, { headers });
                const data = await res.json();

                if (data.errors && Object.keys(data.errors).length > 0) throw new Error("Limite de API esgotado.");

                const jogosBR = (data.response || []).filter(m => m.league.country === 'Brazil' && m.fixture.status.short === 'NS');
                
                // Ordena por hora
                jogosBR.sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date));

                if (jogosBR.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#b3b3b3;">Sem mais jogos agendados para hoje no Brasil.</p>';
                } else {
                    container.innerHTML = '';
                    jogosBR.forEach(match => {
                        const hora = new Date(match.fixture.date).toLocaleTimeString('pt-BR', { hour: '2-digit', minute:'2-digit' });
                        container.innerHTML += `
                            <div class="upcoming-item">
                                <div>
                                    <div style="color:#b3b3b3; font-size:0.8em; margin-bottom:4px;">${match.league.name}</div>
                                    <strong>${match.teams.home.name}</strong> x <strong>${match.teams.away.name}</strong>
                                </div>
                                <div class="time-badge">${hora}</div>
                            </div>
                        `;
                    });
                }
                proximosCarregados = true; // Impede que gaste a API de novo se o utilizador trocar de aba
            } catch (error) {
                container.innerHTML = `<p style="color:#ff5252; text-align:center;">Erro: ${error.message}</p>`;
            }
        }

        // FUNÇÃO: HISTÓRICO
        function salvarHistorico() {
            localStorage.setItem('historicoSniperDuplo', JSON.stringify(historico));
            renderizarHistorico();
        }

        function renderizarHistorico() {
            const container = document.getElementById('historico-list');
            if (historico.length === 0) {
                container.innerHTML = '<span style="color:#666;">Sem registos recentes.</span>';
                return;
            }
            container.innerHTML = '';
            const ultimos = [...historico].reverse().slice(0, 15);
            ultimos.forEach(item => {
                let classeCss = item.status === 'GREEN ✅' ? 'hist-green' : (item.status === 'RED ❌' ? 'hist-red' : 'hist-pendente');
                let corStatus = item.status === 'GREEN ✅' ? '#00e676' : (item.status === 'RED ❌' ? '#ff5252' : '#ffb300');
                let icone = item.tipo === 'CANTOS' ? '🎯' : '⚽';
                
                container.innerHTML += `
                    <div class="hist-item ${classeCss}">
                        <strong>${item.jogo}</strong><br>
                        ${icone} <strong>${item.tipo}</strong> | Aos ${item.minutoAlerta}' min (Tinha ${item.valorAlerta})<br>
                        Resultado: <span style="color:${corStatus}; font-weight:bold;">${item.status}</span>
                    </div>
                `;
            });
        }

        // PERMISSÕES
        document.getElementById('btnAtivar').addEventListener('click', async () => {
            document.getElementById('btnAtivar').style.display = 'none';
            if ("Notification" in window) {
                const permissao = await Notification.requestPermission();
                if (permissao === "granted") new Notification("Radar Ativo", { body: "O radar sniper está a correr." });
            }
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        });

        function exibirMensagemAlerta(tipo) {
            if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`ALERTA: ${tipo}!`, { body: `Oportunidade de ${tipo} no radar!` });
            }
        }

        // FUNÇÃO: AO VIVO (Executa a cada 5 minutos)
        async function fetchAdvancedMatches() {
            try {
                const liveResponse = await fetch('https://v3.football.api-sports.io/fixtures?live=all', { headers });
                const liveData = await liveResponse.json();
                
                const container = document.getElementById('matches-container');
                container.innerHTML = ''; 

                if (liveData.errors && Object.keys(liveData.errors).length > 0) throw new Error("Limite de API esgotado.");

                const todosJogos = liveData.response || [];
                const jogosBrasil = todosJogos.filter(match => match.league.country === 'Brazil');
                const matches = jogosBrasil.slice(0, 5);
                const liveIds = jogosBrasil.map(m => m.fixture.id);

                historico.forEach(hist => {
                    const gameIdRaw = hist.id.split('_')[0];
                    if (hist.status === 'PENDENTE ⏳' && !liveIds.includes(parseInt(gameIdRaw))) {
                        hist.status = 'RED ❌';
                    }
                });
                salvarHistorico();

                if(matches.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#b3b3b3;">Sem jogos brasileiros ao vivo.</p>';
                    updateTime();
                    return;
                }

                let alertouCantos = false;
                let alertouGolos = false;

                for (const match of matches) {
                    const fixtureId = match.fixture.id;
                    const elapsed = match.fixture.status.elapsed;
                    const homeG = match.goals.home ?? 0;
                    const awayG = match.goals.away ?? 0;
                    const totalGolosAtuais = homeG + awayG;
                    
                    const statsResponse = await fetch(`https://v3.football.api-sports.io/fixtures/statistics?fixture=${fixtureId}`, { headers });
                    const statsData = await statsResponse.json();

                    let totalCorners = 0;
                    let totalShots = 0;

                    if (statsData.response && statsData.response.length > 0) {
                        statsData.response.forEach(teamData => {
                            const corners = teamData.statistics.find(s => s.type === "Corner Kicks");
                            const shots = teamData.statistics.find(s => s.type === "Shots on Goal");
                            totalCorners += corners && corners.value !== null ? parseInt(corners.value) : 0;
                            totalShots += shots && shots.value !== null ? parseInt(shots.value) : 0;
                        });
                    }

                    // AVALIAÇÃO GREENS
                    let regCantos = historico.find(h => h.id === `${fixtureId}_CANTOS`);
                    if (regCantos && regCantos.status === 'PENDENTE ⏳' && totalCorners > regCantos.valorAlerta) {
                        regCantos.status = 'GREEN ✅'; salvarHistorico();
                    }
                    let regGolos = historico.find(h => h.id === `${fixtureId}_GOLOS`);
                    if (regGolos && regGolos.status === 'PENDENTE ⏳' && totalGolosAtuais > regGolos.valorAlerta) {
                        regGolos.status = 'GREEN ✅'; salvarHistorico();
                    }

                    // LÓGICA SNIPER
                    const diffGolos = Math.abs(homeG - awayG);
                    const retaFinal = elapsed >= 82 && elapsed <= 87; 
                    const sinalCantos = retaFinal && (diffGolos === 0 || diffGolos === 1) && (totalCorners >= 9) && (totalShots >= 8);
                    const sinalGolos = retaFinal && (diffGolos === 1) && (totalShots >= 10);

                    if (sinalCantos && !regCantos) {
                        historico.push({ id: `${fixtureId}_CANTOS`, jogo: `${match.teams.home.name} x ${match.teams.away.name}`, tipo: 'CANTOS', minutoAlerta: elapsed, valorAlerta: totalCorners, status: 'PENDENTE ⏳' });
                        alertouCantos = true;
                    }
                    if (sinalGolos && !regGolos) {
                        historico.push({ id: `${fixtureId}_GOLOS`, jogo: `${match.teams.home.name} x ${match.teams.away.name}`, tipo: 'GOLOS', minutoAlerta: elapsed, valorAlerta: totalGolosAtuais, status: 'PENDENTE ⏳' });
                        alertouGolos = true;
                    }
                    if (sinalCantos || sinalGolos) salvarHistorico();

                    let cardClass = "match-card live-card";
                    let banners = "";
                    
                    if (sinalCantos && sinalGolos) {
                        cardClass = "match-card alert-duplo";
                        banners = `<div class="banner-cantos">🎯 CANTOS LIMITE</div><div class="banner-golos">⚽ GOLO LIMITE</div>`;
                    } else if (sinalCantos) {
                        cardClass = "match-card alert-cantos";
                        banners = `<div class="banner-cantos">🎯 CANTOS LIMITE</div>`;
                    } else if (sinalGolos) {
                        cardClass = "match-card alert-golos";
                        banners = `<div class="banner-golos">⚽ GOLO LIMITE</div>`;
                    }

                    const card = `
                        <div class="${cardClass}">
                            ${banners}
                            <div class="match-header">
                                <span>${match.teams.home.name} ${homeG} x ${awayG} ${match.teams.away.name}</span>
                                <span style="color: ${sinalCantos || sinalGolos ? '#fff' : '#00e676'};">${elapsed}' min</span>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-item">Competição: <span style="color:#fff;">${match.league.name}</span></div>
                                <div class="stat-item">Cantos: <span class="highlight">${totalCorners}</span></div>
                                <div class="stat-item">Remates à Baliza: <span class="highlight">${totalShots}</span></div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
                
                if (alertouCantos) exibirMensagemAlerta("CANTOS");
                if (alertouGolos) exibirMensagemAlerta("GOLOS");

                updateTime();
            } catch (error) {
                document.getElementById('matches-container').innerHTML = `<p class="error">Falha: ${error.message}</p>`;
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('last-update').innerText = `Atualiza a cada 5 minutos | ${now.toLocaleTimeString('pt-PT')}`;
        }

        renderizarHistorico();
        fetchAdvancedMatches();
        setInterval(fetchAdvancedMatches, 300000); 
    </script>
</body>
</html>
